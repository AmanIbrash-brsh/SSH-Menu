# Isolated tmux server for the SSH menu's broadcast windows (tmux -L sshmenu); your ~/.tmux.conf is untouched.
set -g status off
set -g mouse on
set -g escape-time 0
set -g allow-set-title off
set -g remain-on-exit failed
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style "fg=#3a2a2e"
set -g pane-active-border-style "fg=#e91e63"
set -g pane-border-format " #{pane_title}#{?pane_synchronized,  #[fg=#e91e63]sync#[default],} "
# Alt+S: typing goes to all panes / only this one.  Alt+Z: zoom the current pane.
bind -n M-s setw synchronize-panes
bind -n M-z resize-pane -Z
